# CoordiNode server configuration.
#
# This is the single configuration gate for the server. It is read by
# /usr/lib/systemd/system/coordinode.service via:
#
#   ExecStart=/usr/bin/coordinode serve --config /etc/coordinode/coordinode.conf
#
# Every value here can also be given as a `coordinode serve` command-line flag;
# the command line overrides this file, which overrides the built-in defaults.
# After editing, run:
#
#   sudo systemctl restart coordinode
#
# Format is YAML. Uncommented keys override the default; commented keys show the
# default value. Marked as a configuration file in the RPM/DEB package, so local
# edits are preserved across upgrades.

# Operational mode. CE supports only "full"; "compute" / "storage" require
# coordinode-ee.
mode: full

# Numeric node id for this instance. Single-node deployments use 1. A value
# above 1 is only valid together with a non-empty `peers` list.
node_id: 1

# gRPC listen address (native API + inter-node Raft).
grpc_addr: "0.0.0.0:7080"

# Address advertised to peers (defaults to grpc_addr when unset).
# advertise_addr: "node1.internal:7080"

# REST/JSON listen address (transcoded from gRPC by the embedded proxy).
rest_addr: "0.0.0.0:7081"

# Operational HTTP listen address — Prometheus /metrics, /health, /ready.
# Bind to loopback by default; expose via reverse proxy if scraping remotely.
ops_addr: "127.0.0.1:7084"

# PostgreSQL wire-protocol listen address. Disabled by default. Uncomment to
# accept SQL over the Postgres protocol; trust authentication only, so bind it
# to a trusted interface (loopback / internal network).
# pg_addr: "127.0.0.1:7085"

# Data directory. Owned by the coordinode system user; created by systemd's
# StateDirectory= on first start when missing. Used by the consensus log, CDC,
# and (when storage.endpoints below is empty) as the single storage endpoint.
data_dir: /var/lib/coordinode/data

# Storage topology. Leave storage.endpoints empty (the default) for the common
# single-disk case: one durable HDD warm-tier endpoint rooted at data_dir.
#
# To spread storage across multiple disks (NVMe cache + SSD + HDD JBOD), declare
# each mount point as an endpoint. Per-LSM-level placement, cascade eviction, and
# WAL/oplog routing across endpoints are driven from this list. Per endpoint:
#
#   id           required  unique name (metrics, logs, placement)
#   path         required  exclusive mount-point directory
#   media        required  hdd | ssd | nvme | ram
#   durability   required  durable | degraded | volatile
#   tier         required  memory | hot_cache | hot | warm | cold
#   capacity_bytes      opt  physical capacity (0 / omitted = untracked)
#   hard_limit_bytes    opt  never write past this (0 / omitted = no limit)
#   page_ecc            opt  auto (default) | force_on | force_off
#                            auto: ECC on for degraded, off for durable / volatile.
#                            force_on needs a binary built with --features page_ecc.
#   hard_limit_strategy opt  reject (default) | cascade_evict
#
# When set, storage.endpoints overrides data_dir for storage placement. Passing
# --data on the command line collapses back to a single endpoint at that path.
#
# storage:
#   endpoints:
#     - id: nvme-hot
#       path: /mnt/nvme0/coordinode
#       media: nvme
#       durability: durable
#       tier: hot
#     - id: hdd-cold
#       path: /mnt/hdd0/coordinode
#       media: hdd
#       durability: degraded
#       tier: cold
#       page_ecc: force_on
#       capacity_bytes: 16000000000000
# Write-backpressure thresholds, per partition tree. Two axes, each with a
# slowdown and a stop level: the L0 run count and the pending-compaction byte
# debt. Crossing a slowdown level raises that partition's compaction priority
# and shows up in metrics (coordinode_storage_backpressure_tier); crossing a
# stop level makes commits carrying writes fail with a retryable
# WRITE_BACKPRESSURE error until compaction catches up. The server never
# sleeps on the verdict, and Raft apply is never gated. Defaults shown.
#
# storage:
#   backpressure:
#     l0_slowdown: 40
#     l0_stop: 200
#     bytes_slowdown: 68719476736    # 64 GiB
#     bytes_stop: 274877906944      # 256 GiB
storage:
  endpoints: []

# Cluster peer addresses. Empty = standalone single node. For a 3-node HA
# cluster, list the other members' advertise addresses on each node:
# peers:
#   - "node2.internal:7080"
#   - "node3.internal:7080"
peers: []

# How long a membership change (admin node join, the promotion after it,
# admin node decommission) waits for the previous change to commit before it
# is refused, in seconds. The cluster takes one change at a time; running out
# of this means it has lost the quorum to commit.
# membership_change_timeout_secs: 30

# How long the query planner reuses its storage statistics (node counts per
# label, edge fan-out) before reading them again, in seconds. A read that
# fails, because a statistics counter is damaged, is remembered and logged
# once for the same time; queries then plan with defaults.
# planner_stats_ttl_secs: 60

# Open-file-descriptor soft-limit target. Unset = raise the soft limit to the
# hard limit (the unit's LimitNOFILE).
# nofile: 262144

# Max in-flight requests per client connection. Unset = unbounded.
# max_connections: 1024

# Max decoded request size in MiB.
max_request_size_mb: 16

# Per-request timeout in seconds. Unset = no timeout.
# request_timeout_secs: 30

# HTTP/2 keepalive ping interval in seconds. Unset = disabled.
# http2_keepalive_secs: 60

# Block-cache size in MiB. Unset = storage-engine default.
# cache_size_mb: 4096

# Memtable size in MiB. Unset = storage-engine default.
# write_buffer_mb: 256

# MVCC time-travel / AS OF TIMESTAMP horizon in seconds. Unset = 7 days.
# Enforced by the storage engine; history inside the window is served from
# the tree versions current at each point, so the window holds every
# compaction's input tables on disk until the horizon passes it. Reads older
# than the horizon are refused (OUT_OF_RANGE / OUTSIDE_RETENTION).
# retention_window_secs: 604800

# Ceiling on the invariant claims held by all in-flight write attempts on this
# node, together. A claim is what a mutation states its result depends on (an
# endpoint it needs to keep existing, a bound it decided, a pair it observed).
# At the ceiling an attempt is refused (ABORTED / INVARIANT_REFUSED) and can be
# retried, rather than the guard table growing with load. Unset = 100000.
# max_invariant_claims: 100000

# Ceiling on the commits admitted and not yet applied on this node. A commit
# registers the keys it will write before validating them and holds that
# registration until its writes are local state, so this is bounded by write
# concurrency rather than by data size. At the ceiling a commit is refused as
# retryable backpressure. Reaching it means commits are not finishing.
# Unset = 10000.
# max_commits_in_flight: 10000

# How long a read waits, in milliseconds, for commits that are still landing
# before it is answered from a view that stops behind them. Waiting keeps the
# view fresh for the microseconds a commit needs to apply; stepping behind is
# instant but hands back a view older than the reader's own last write.
# Unset = 5.
# snapshot_wait_ms: 5

# The shard whose node rows this engine holds. Node keys carry the shard ahead
# of the id, and the invariant guard resolves a node from its id alone, so it
# needs this to find the row. Must match the shard statements run against.
# Unset = 0.
# node_shard: 0

# Consumer-registry heartbeat coalescing window in ms. Unset = 100.
# registry_heartbeat_ms: 100

# Consumer-registry TTL-eviction sweep interval in ms. Unset = 1000.
# registry_eviction_ms: 1000

# CDC change-stream consumer TTL in seconds. How long a disconnected/crashed
# change-stream reader holds the oplog retention floor before it is reclaimed.
# Connected readers heartbeat every poll and are never evicted. Unset = 30.
# cdc_consumer_ttl_secs: 30

# AFTER COMMIT trigger dispatch (fine tunables — config-file only, no CLI flag).
# The first three are runtime-tunable on a live database by an owner via the
# privileged setParameter surface; per-trigger CASCADE_LIMIT / ON ERROR RETRY n
# WITH BACKOFF ms override them per definition.
#
# Async cascade-depth cap: a self-/mutually-triggering AFTER COMMIT chain deeper
# than this is dead-lettered as a cascade overflow rather than looping. Unset = 10.
# trigger_max_cascade_depth: 10
# Default retry attempts for an AFTER COMMIT trigger with no ON ERROR clause,
# before the event is dead-lettered into trigger_failures. Unset = 3.
# trigger_default_retry_attempts: 3
# Default base retry backoff in ms (per-attempt wait = backoff * 2^attempt). Unset = 1000.
# trigger_default_backoff_ms: 1000
# How often the leader's AFTER COMMIT dispatch worker wakes to fire due retries,
# in ms (it also wakes immediately on each replicated write). Restart to change.
# Unset = 500.
# trigger_dispatch_interval_ms: 500

# Auto-rollback an interactive transaction (BEGIN without COMMIT) that has been
# idle this long, freeing its pinned MVCC snapshot and buffered memory.
interactive_txn_idle_timeout_secs: 30

# Max buffered (uncommitted) bytes per interactive transaction before it is
# aborted (268435456 = 256 MiB).
interactive_txn_max_bytes: 268435456

# Inter-node gRPC transport zstd compression level for wire traffic (C-zstd
# numbering: 1..=22 trade speed for ratio). Default 3 is zstd's standard
# speed/ratio default (~9x smaller Raft batches on the wire). Raise it on a
# bandwidth-constrained link (e.g. a geo replica) where bandwidth costs more
# than CPU.
wire_compression_level: 3

# Inter-node + client gRPC TLS. Set tls_cert + tls_key (PEM paths) to serve over
# TLS (pure-Rust crypto, no C FFI); unset = plaintext (single-host dev). tls_ca
# is the CA that verifies peers; with tls_require_client_auth = true the server
# requires + verifies a client certificate (mutual TLS for node-to-node).
# tls_cert: /etc/coordinode/tls/node.crt
# tls_key: /etc/coordinode/tls/node.key
# tls_ca: /etc/coordinode/tls/ca.crt
# tls_require_client_auth: false

# Background integrity scrub. Each node periodically verifies every on-disk
# block's checksum against its stored value, surfacing silent bit rot before a
# live read hits it. Runs per node on its own local storage (no coordination).
# scrub_enabled: true
# Seconds between full scrub cycles (default 7 days).
# scrub_interval_secs: 604800
# Pause between SST scans in ms so the scrub yields I/O to production; 0 = full
# speed (default 50).
# scrub_throttle_ms: 50

# Periodic local checkpoints. A checkpoint is the base for WAL-replay repair
# (rebuild a corrupt partition from the last checkpoint + oplog when no healthy
# replica can serve it). Per node, taken on an interval. Single-endpoint engines
# only (multi-endpoint checkpoint is not supported yet).
# checkpoint_enabled: true
# Seconds between checkpoints (default 1 hour).
# checkpoint_interval_secs: 3600
# Directory checkpoints are written under (default <data_dir>/checkpoints).
# checkpoint_dir: /var/lib/coordinode/checkpoints
# Number of recent checkpoints to retain (default 3).
# checkpoint_keep: 3

# Settings belonging to a distribution built on top of this server (the
# Enterprise build, or your own). Everything under `extensions` is passed
# through untouched: the base server never reads it, and each registered
# extension parses its own key. Leave the table out entirely when running the
# stock build.
# extensions:
#   pitr:
#     enabled: true
#     target: /var/lib/coordinode/pitr
#     interval_secs: 3600
