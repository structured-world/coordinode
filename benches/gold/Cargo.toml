[workspace]
# Standalone workspace so the main production workspace (and Docker image)
# doesn't need to resolve this crate. Run via `cd benches/gold && cargo …`.

[package]
name = "coordinode-gold-bench"
description = "Gold benchmark suite (L2 from arch/benchmarks/methodology.md): YCSB, LDBC SNB, ann-benchmarks, TSBS, SpatialBench against published competitor baselines. Outputs the structured per-modality + composite score report."
version = "0.4.3"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false  # internal benchmark harness; not for crates.io

[[bin]]
name = "gold-ycsb"
path = "src/ycsb/main.rs"

[[bin]]
name = "gold-report"
path = "src/report/main.rs"

[[bin]]
name = "gold-retention"
path = "src/retention/main.rs"

[dependencies]
coordinode-storage = { path = "../../crates/coordinode-storage" }
coordinode-modality = { path = "../../crates/coordinode-modality" }
coordinode-core = { path = "../../crates/coordinode-core" }
# Same engine the storage crate binds to: the retention harness drives the
# tree's own Leveled compaction, as the engine's background worker does.
lsm-tree = { package = "coordinode-lsm-tree", version = "5", default-features = false }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"

# A standalone workspace does not inherit the production workspace's lint
# table, so the one entry that matters here is repeated: the repo-wide
# clippy.toml lists the storage partition enum as a disallowed type for the
# query layer (ADR-041), and this harness drives the storage engine's KV path
# directly, where naming a partition is the point.
[lints.clippy]
disallowed_types = "allow"

# Match the production workspace release profile: one codegen unit for
# stable, maximally optimized benchmark binaries (run-to-run comparability).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
