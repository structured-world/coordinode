name: Embedded registry packages
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/prepare-registry
      - name: Keep package qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registry-qualification
          path: |
            target/registry-preparation.json
            target/fresh-dependency-metadata.json
            target/prepared-consumer-metadata.json
            target/*-licenses.json
            target/*-sbom.cdx.json
          if-no-files-found: ignore
      - name: Clean the build output
        if: always()
        run: cargo clean
