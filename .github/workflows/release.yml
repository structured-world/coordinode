name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build (e.g. v0.1.0-alpha.1)"
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  REGISTRY: ghcr.io
  TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
  IMAGE_NAME: ${{ github.repository }}

# Each job takes only the write access it uses: release assets for the jobs
# that edit or attach to the release, packages for the image jobs.
permissions:
  contents: read

jobs:
  # Extract release notes for this version from CHANGELOG.md (written by release-plz)
  # and update the GitHub Release body. Runs before binary builds so notes are ready early.
  update-changelog:
    name: Update release notes
    runs-on: ubuntu-latest
    # Notes update is cosmetic — a failure here must not block RPM /
    # deb / docker artifact builds. The `gh release edit` step has
    # been observed to fail intermittently on workflow_dispatch reruns
    # of an already-published tag; downstream jobs use `needs.*.result`
    # to ignore that.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Extract release notes for ${{ env.TAG_NAME }}
        run: |
          # shellcheck disable=SC2016 # `${...}` below is a JavaScript template, not the shell's
          node --input-type=module -e '
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          const tag = process.env.TAG_NAME;
          const content = existsSync("CHANGELOG.md") ? readFileSync("CHANGELOG.md", "utf8") : "";
          // Sections are separated by "---" lines or by the next "## v" header.
          const escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const match = new RegExp(`^## ${escaped}[^\\n]*\\n([\\s\\S]*?)(?=\\n---|\\n## v|$(?![\\s\\S]))`, "m").exec(content);
          writeFileSync("/tmp/release-notes.md", match ? match[1].trim() + "\n" : `Release ${tag}\n`);
          '

      - name: Update GitHub Release body
        run: gh release edit "${{ env.TAG_NAME }}" --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-musl:
    name: Build musl (${{ matrix.target }})
    # Release-notes update is cosmetic and independent — don't gate
    # binary builds on it. docker-build / docker-manifest already run
    # in parallel for the same reason.
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: coordinode-linux-amd64
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            artifact: coordinode-linux-arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Build the tag, not the branch the run happened to start from.
          # For a release event this is what checkout picks anyway; for a
          # manual dispatch it is the difference between building the tagged
          # tree and building whatever main holds right now.
          ref: ${{ env.TAG_NAME }}

      - name: Install rustup
        uses: dtolnay/rust-toolchain@stable

      # The target's std is installed per toolchain and cargo takes the
      # toolchain from rust-toolchain.toml, so the musl std must go into that
      # toolchain, not one named here. Run from the checkout, both commands
      # resolve the toolchain the file names.
      - name: Install the toolchain + musl target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - name: Install musl tools + protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler libprotobuf-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static binary
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bin coordinode
          strip target/${{ matrix.target }}/release/coordinode || true

      - name: Package
        run: |
          VERSION=${{ env.TAG_NAME }}
          cp target/${{ matrix.target }}/release/coordinode coordinode-${VERSION}-${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: coordinode-${{ env.TAG_NAME }}-${{ matrix.artifact }}
          retention-days: 1

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: coordinode-${{ env.TAG_NAME }}-${{ matrix.artifact }}

  build-rpm:
    name: Build RPM (${{ matrix.fedora }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    # The binary is compiled in the release's own image, against the glibc it
    # ships (see build-deb).
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The current Fedora release and the one before it.
          - fedora: "44"
            arch: x86_64
            runs-on: ubuntu-latest
          - fedora: "44"
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - fedora: "45"
            arch: x86_64
            runs-on: ubuntu-latest
          - fedora: "45"
            arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build and packaging tools
        run: |
          # gcc links the binary; git lets checkout fetch the proto submodule.
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmdevtools systemd-rpm-macros findutils tar \
            gcc git
          rpmdev-setuptree

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ env.TAG_NAME }}

      - name: Install rustup
        uses: dtolnay/rust-toolchain@stable

      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: fc${{ matrix.fedora }}-${{ matrix.arch }}

      - name: Build the binary
        run: cargo build --locked --release --bin coordinode

      - name: Stage sources
        run: |
          VERSION=$(echo "${{ env.TAG_NAME }}" | sed 's/^v//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          install -m 0755 target/release/coordinode ~/rpmbuild/SOURCES/coordinode
          install -m 0644 packaging/coordinode.service   ~/rpmbuild/SOURCES/coordinode.service
          install -m 0644 packaging/coordinode.conf      ~/rpmbuild/SOURCES/coordinode.conf
          install -m 0644 packaging/coordinode.sysusers  ~/rpmbuild/SOURCES/coordinode.sysusers
          install -m 0644 packaging/coordinode.tmpfiles  ~/rpmbuild/SOURCES/coordinode.tmpfiles
          install -m 0644 LICENSE                        ~/rpmbuild/SOURCES/LICENSE
          install -m 0644 README.md                      ~/rpmbuild/SOURCES/README.md

      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "version $VERSION" \
            --target ${{ matrix.arch }} \
            packaging/rpm/coordinode.spec
          find ~/rpmbuild/RPMS -name '*.rpm' -print

      - name: Lint with rpmlint (advisory)
        continue-on-error: true
        run: |
          dnf install -y --setopt=install_weak_deps=False rpmlint || true
          find ~/rpmbuild/RPMS -name '*.rpm' -exec rpmlint {} + || true

      - name: Stage artifact
        run: |
          mkdir -p /tmp/artifacts
          cp ~/rpmbuild/RPMS/${{ matrix.arch }}/*.rpm /tmp/artifacts/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-fc${{ matrix.fedora }}-${{ matrix.arch }}
          path: /tmp/artifacts/*.rpm
          if-no-files-found: error

      - name: Attach RPM to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: /tmp/artifacts/*.rpm

  build-deb:
    name: Build DEB (${{ matrix.codename }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    container:
      image: ${{ matrix.image }}
    # Each release gets a binary compiled in its own image, against the glibc
    # it ships; the static musl binary stays for the image and the release
    # downloads. The package name carries the codename
    # (coordinode_<version>_<codename>_<arch>.deb), which the package
    # repository reads to publish it into that dist alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The current release and the one before it, for Debian and for
          # Ubuntu (whose interim releases have left support by then).
          - codename: bookworm
            image: debian:bookworm
            arch: amd64
            runs-on: ubuntu-latest
          - codename: bookworm
            image: debian:bookworm
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - codename: trixie
            image: debian:trixie
            arch: amd64
            runs-on: ubuntu-latest
          - codename: trixie
            image: debian:trixie
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - codename: noble
            image: ubuntu:noble
            arch: amd64
            runs-on: ubuntu-latest
          - codename: noble
            image: ubuntu:noble
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - codename: resolute
            image: ubuntu:resolute
            arch: amd64
            runs-on: ubuntu-latest
          - codename: resolute
            image: ubuntu:resolute
            arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build and packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # build-essential satisfies the implicit Build-Depends pulled in by
          # debhelper-compat (= 13) and links the binary; git lets checkout
          # fetch the proto submodule; curl installs rustup.
          apt-get install -y --no-install-recommends \
            debhelper dpkg-dev ca-certificates findutils \
            build-essential adduser git curl

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ env.TAG_NAME }}

      - name: Install rustup
        uses: dtolnay/rust-toolchain@stable

      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install

      # The protos use proto3 `optional` and newer protoc features than a
      # distribution may ship, so the current protoc release is installed.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.codename }}-${{ matrix.arch }}

      - name: Build the binary
        run: cargo build --locked --release --bin coordinode

      - name: Assemble source tree
        run: |
          VERSION=$(echo "${{ env.TAG_NAME }}" | sed 's/^v//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          BUILD=/tmp/coordinode-$VERSION
          mkdir -p "$BUILD/packaging"
          # Stage the binary as the canonical name expected by debian/rules.
          install -m 0755 target/release/coordinode "$BUILD/coordinode"
          cp -r packaging/coordinode.service packaging/coordinode.conf \
                packaging/coordinode.sysusers packaging/coordinode.tmpfiles \
                "$BUILD/packaging/"
          cp -r packaging/deb/debian "$BUILD/"
          cp LICENSE README.md "$BUILD/"
          # Rewrite the placeholder changelog with the actual version.
          cat > "$BUILD/debian/changelog" <<CHANGELOG
          coordinode ($VERSION) ${{ matrix.codename }}; urgency=medium

            * Automated release $VERSION; see CHANGELOG.md upstream.

           -- Release Bot <oss@sw.foundation>  $(date -R)
          CHANGELOG
          echo "BUILD_DIR=$BUILD" >> "$GITHUB_ENV"

      - name: Build DEB
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          dpkg-buildpackage -us -uc -b -a${{ matrix.arch }}
          ls -la ..

      - name: Lint with lintian (advisory)
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends lintian || true
          lintian /tmp/coordinode_*_${{ matrix.arch }}.deb || true

      - name: Stage artifact
        run: |
          mkdir -p /tmp/artifacts
          cp "/tmp/coordinode_${VERSION}_${{ matrix.arch }}.deb" \
             "/tmp/artifacts/coordinode_${VERSION}_${{ matrix.codename }}_${{ matrix.arch }}.deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}-${{ matrix.arch }}
          path: /tmp/artifacts/*.deb
          if-no-files-found: error

      - name: Attach DEB to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: /tmp/artifacts/*.deb

  publish-repo:
    name: Publish to repo.sw.foundation
    runs-on: ubuntu-latest
    needs: [build-rpm, build-deb]
    steps:
      - uses: actions/checkout@v6

      - name: Repo metadata
        run: |
          mkdir -p /tmp/repo-meta
          cp packaging/manifest.json /tmp/repo-meta/

      - name: Upload repo-meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-meta-coordinode
          path: /tmp/repo-meta/

      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          repositories: repo

      - name: Trigger repo publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/structured-world/repo/dispatches \
            --method POST \
            -f event_type=publish-from-coordinode \
            -f "client_payload[coordinode_run_id]=${{ github.run_id }}" \
            -f "client_payload[coordinode_repo]=${{ github.repository }}"

  # Build per-platform images on native runners, then merge into a multi-arch manifest.
  # This avoids QEMU emulation (~90 min for arm64) — each platform builds natively (~15 min).
  docker-build:
    name: Build Docker image (${{ matrix.platform }})
    # One leg runs on a self-hosted runner, which a fork never reaches.
    if: github.repository_owner == 'structured-world'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            # amd64 Docker build runs on a self-hosted runner: GH-hosted
            # ubuntu-latest disk is too small for the full workspace cargo
            # build that the image's multi-stage Dockerfile performs.
            runs-on:
              - self-hosted
              - coordinode
          - platform: linux/arm64
            # arm64 stays on GH-hosted; we don't have an arm self-hosted runner.
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Build the tag, not the branch the run happened to start from.
          # For a release event this is what checkout picks anyway; for a
          # manual dispatch it is the difference between building the tagged
          # tree and building whatever main holds right now.
          ref: ${{ env.TAG_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Merge Docker manifest
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Create and push multi-arch manifest
        run: |
          # One `-t <tag>` pair per tag and one image reference per digest file,
          # built as arrays so no value is split on whitespace or globbed.
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"
        working-directory: /tmp/digests
