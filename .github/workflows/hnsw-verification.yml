name: Lock-free HNSW verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: HNSW changes
    # The verification jobs are required checks, so they must report on every
    # pull request: a workflow filtered by path would leave them pending on
    # one that does not touch the vector crate. Instead they run when it does
    # and are skipped otherwise, and a skipped job counts as passed.
    runs-on: ubuntu-latest
    outputs:
      vector: ${{ steps.diff.outputs.vector }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "vector=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" \
            | grep -qE '^(crates/coordinode-vector/|\.github/workflows/hnsw-verification\.yml$)'; then
            echo "vector=true" >> "$GITHUB_OUTPUT"
          else
            echo "vector=false" >> "$GITHUB_OUTPUT"
          fi

  miri-neighbours:
    name: Miri — AtomicNeighbourList primitives
    needs: changes
    if: needs.changes.outputs.vector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run miri on the publication and level-0 storage tests
        # These modules hold every atomic primitive of the lock-free HNSW
        # write path: whole-list publication with epoch retirement
        # (neighbours) and the level-0 store that publishes through it,
        # including its growth (data_level0). Miri
        # scans the abstract Rust machine for undefined behaviour: bad atomic
        # orderings, uninitialised reads, aliasing. Higher-level integration
        # tests use rayon and would time out under miri; they are covered by
        # the proptest stress in the regular CI job and the loom job below.
        #
        # Tree Borrows, because crossbeam-epoch itself violates Stacked
        # Borrows while walking its global participant list on every pin
        # (crossbeam-rs/crossbeam#545), so the default model aborts inside
        # the reclamation library before reaching our code. Its global
        # collector also lives for the whole process, hence ignore-leaks.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-permissive-provenance -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: |
          cd crates/coordinode-vector
          cargo +nightly miri test --lib --no-fail-fast -- \
            hnsw::neighbours:: hnsw::data_level0::

  loom-neighbours:
    name: Loom — AtomicNeighbourList interleavings
    needs: changes
    if: needs.changes.outputs.vector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Disable the workspace-hack
        # The workspace-hack unifies the whole workspace's dependency features
        # into every member, so building coordinode-vector alone would pull in
        # crates such as hyper-util that need `tokio::net`, which tokio removes
        # under `--cfg loom`. Emptying the hack builds only vector's own graph.
        run: cargo hakari disable

      - uses: Swatinem/rust-cache@v2
        with:
          # Loom uses a different build cfg, so cache separately from the
          # regular build to avoid recompile churn on the main test job.
          key: loom

      - name: Run loom interleaving suite
        # Loom permutes every observable order of atomic operations on the
        # lock-free HNSW primitives — exhaustive verification that:
        #
        # * AtomicNeighbourList: a reader sees one whole published list
        #   (never a mix of the list before and after a replace), and a
        #   writer that loses the descriptor CAS rebuilds against the
        #   winner, so `cas_append` never loses writes. `crossbeam_loom`
        #   runs the epoch reclamation on loom's atomics too, so the model
        #   covers the real publication and retirement path; two
        #   preemptions keep that larger state space tractable.
        # * EntryPoint — packed `(level, idx)` CAS-loop honours the
        #   layer-promotion linearisability invariant: after every legal
        #   interleaving of two
        #   concurrent `try_promote` callers, exactly one Installs on
        #   the seed race, the highest level always wins on a mixed
        #   race, and equal-level races are idempotent.
        #
        # Each test binary is invoked separately because loom is
        # nondeterministic-fail when binaries share global state across
        # `loom::model` runs in the same process.
        env:
          RUSTFLAGS: --cfg loom --cfg crossbeam_loom
        run: |
          LOOM_MAX_PREEMPTIONS=2 cargo nextest run \
            --test loom_neighbours \
            --release \
            -p coordinode-vector \
            --no-fail-fast
          cargo nextest run \
            --test loom_entry_point \
            --release \
            -p coordinode-vector \
            --no-fail-fast
