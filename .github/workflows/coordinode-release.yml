name: Release PLZ

on:
  push:
    branches:
      - main
  # Re-run against the current main without inventing a commit, for when the
  # release PR needs regenerating after a change to release-plz itself.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-plz-0.3.168

      # Pinned: a release tool that changes behaviour between two runs of the
      # same commit is not something to find out about from a release PR. Bump
      # the version here (and the cache key above) after reproducing both
      # commands' effect on a throwaway clone.
      - name: Install release-plz
        run: cargo install release-plz --version 0.3.168 --locked

      - name: Run release-plz release
        # Runs first so the git tag exists before release-pr computes the next
        # version. Running release-pr first caused duplicate release PRs: it saw
        # the old tag and proposed the same version again (e.g. 0.3.3→0.3.4 twice).
        # No-op on feature pushes; expected to exit 0 before a release PR is merged.
        continue-on-error: true
        run: |
          release-plz release \
            --git-token "${GITHUB_TOKEN}" \
            --config .release-plz.toml \
            --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Fetch tags after release
        # release-plz release creates tags via GitHub API (not git tag + push),
        # so the local git clone does not see the new tag after the previous step.
        # Without this fetch, release-pr queries local tags, finds the old tag,
        # and generates a duplicate release PR (e.g. 0.3.4→0.3.5 when already at 0.3.5).
        run: git fetch --tags

      - name: Run release-plz release-pr
        run: |
          release-plz release-pr \
            --git-token "${GITHUB_TOKEN}" \
            --config .release-plz.toml \
            --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
