name: Release PLZ

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release PR to retry (empty selects the current main commit)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.repository == 'structured-world/coordinode'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: current
      - name: Install the release scripts' dependencies
        run: npm ci --prefix scripts/release
      - name: Select the approved release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          release_args=(source --checkout "$GITHUB_WORKSPACE")
          if [[ -n "$RELEASE_PR" ]]; then
            release_args+=(--release-pr "$RELEASE_PR")
          fi
          node scripts/release/registry.ts "${release_args[@]}"
      - uses: actions/checkout@v7
        if: steps.source.outputs.commit != github.sha
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # The checkout above cleans untracked files, the installed dependencies too.
      - name: Install the selected source's release script dependencies
        if: steps.source.outputs.commit != github.sha
        run: npm ci --prefix scripts/release
      - name: Identify the merged release PR
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/registry.ts eligible --checkout "$GITHUB_WORKSPACE"
      - name: Require the source suite on this exact commit
        if: steps.eligible.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          run_id="$(gh run list --repo structured-world/coordinode --workflow ci.yml \
            --commit "$revision" --limit 20 --json databaseId,event,headBranch \
            --jq 'map(select(.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch")))
                  | first | .databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "Run CI on this main commit before publishing" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo structured-world/coordinode --exit-status
      - name: Select the exact commit release-plz will publish
        if: steps.eligible.outputs.publish == 'true'
        env:
          PUBLICATION_COMMIT: ${{ steps.eligible.outputs.publication_commit }}
        run: git checkout --detach "$PUBLICATION_COMMIT"
      - name: Prepare and qualify the actual archives
        if: steps.eligible.outputs.publish == 'true'
        uses: ./.github/actions/prepare-registry
        env:
          SOURCE_CI_COMMIT: ${{ steps.eligible.outputs.verified_commit }}
      - name: Reconcile any earlier partial publication
        if: steps.eligible.outputs.publish == 'true'
        run: node scripts/release/registry.ts preflight --checkout "$GITHUB_WORKSPACE"
      - name: Install the verified release-plz build
        if: steps.eligible.outputs.publish == 'true'
        run: bash scripts/release/install_release_plz.sh
      - uses: actions/create-github-app-token@v3
        if: steps.eligible.outputs.publish == 'true'
        id: app
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      # Authenticate even when reconciliation finds every version already uploaded.
      - name: Obtain the publication credential through OIDC
        if: steps.eligible.outputs.publish == 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish through OIDC
        if: steps.eligible.outputs.publish == 'true'
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: release-plz release --forge github --config .release-plz.toml --allow-dirty --no-verify
      - name: Verify every published checksum and a real registry consumer
        if: steps.eligible.outputs.publish == 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          node scripts/release/registry.ts verify --checkout "$GITHUB_WORKSPACE"
          node scripts/release/check_packages.ts --checkout "$GITHUB_WORKSPACE" \
            --source crates-io --consumer-toolchain stable
      # The SBOM and license inventory of the graph a consumer installs from
      # crates.io, per toolchain, feature set and target, ship with the release.
      - name: Attach dependency and license evidence to the release
        if: steps.eligible.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          version="$(jq -r .version target/registry-preparation.json)"
          gh release upload "v${version}" --repo structured-world/coordinode --clobber \
            target/crates-io-*-licenses.json target/crates-io-*-sbom.cdx.json
      - name: Keep publication evidence
        if: always() && steps.eligible.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: registry-publication
          path: |
            target/registry-preparation.json
            target/fresh-dependency-metadata.json
            target/prepared-consumer-metadata.json
            target/crates-io-consumer-metadata.json
            target/*-licenses.json
            target/*-sbom.cdx.json
            target/package/*.crate
          if-no-files-found: ignore
      - name: Clean build outputs
        if: always() && steps.eligible.outputs.publish == 'true'
        run: cargo clean

  release-pr:
    needs: release
    runs-on: ubuntu-latest
    # Publication has no coalescing queue: each merged release keeps its own
    # execution. Only preparation of the next PR can replace a pending run.
    concurrency:
      group: coordinode-release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Install source and release-configuration tools
        # mold: the project's cargo config links with it on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev mold
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - uses: actions/setup-node@v7
        with:
          node-version: current
      - name: Install the verified release-plz build
        run: bash scripts/release/install_release_plz.sh
      - name: Calculate release-PR baselines from registry state
        run: |
          set -euo pipefail
          npm ci --prefix scripts/release
          (cd scripts/release && node --test)
          node scripts/release/pr_config.ts --checkout "$GITHUB_WORKSPACE"
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare the release PR from clean source
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          release-plz release-pr --forge github --config target/release-pr-config.toml \
            --output json > target/release-pr.json
          cat target/release-pr.json
      # The example builds from registry packages, outside the workspace that
      # release-plz versions, so the release PR brings its requirements along.
      - name: Bring the example's requirements to the release
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node scripts/release/example_requirements.ts --checkout "$GITHUB_WORKSPACE" \
            --pr-json target/release-pr.json
      - name: Clean build outputs
        if: always()
        run: cargo clean
