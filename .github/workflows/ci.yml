name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Override rust-toolchain.toml MSRV — dependencies require Rust 1.90+.
  RUSTUP_TOOLCHAIN: stable

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protobuf compiler (skip if present)
        # `protoc` is preinstalled on the self-hosted runner (Fedora,
        # uses dnf — apt-get would not exist there and `sudo apt-get`
        # would prompt for a password the workflow can't supply).
        # GH-hosted ubuntu-latest still needs the install.
        run: |
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already installed: $(protoc --version)"
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  hakari:
    name: Workspace hack
    # The workspace-hack crate pins the unified features of third-party
    # dependencies so a single-package build and a workspace build share their
    # artefacts. It is generated; a dependency change that is not followed by
    # `cargo hakari generate && cargo hakari manage-deps` leaves it stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hakari
      - name: Check the workspace-hack is up to date
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run

  test:
    name: Test
    # GH-hosted ubuntu-latest has ~14 GB disk which the full workspace
    # debug build exceeds (linker hits "No space left on device"). Moved
    # to a self-hosted runner where target/ has room.
    runs-on:
      - self-hosted
      - coordinode
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler (skip if present)
        # `protoc` is preinstalled on the self-hosted runner (Fedora,
        # uses dnf — apt-get would not exist there and `sudo apt-get`
        # would prompt for a password the workflow can't supply).
        # GH-hosted ubuntu-latest still needs the install.
        run: |
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already installed: $(protoc --version)"
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build coordinode binary (required by integration tests)
        run: cargo build -p coordinode-server --all-features
      - name: Run unit + integration tests (nextest)
        # The self-hosted runner is shared (CI, bench, and HNSW workflows can
        # run concurrently), so CPU oversubscription can starve Raft heartbeats
        # and trigger spurious elections in the election-timing-sensitive cluster
        # tests. Give those tests generous election timeouts; production timeouts
        # (300-600ms) are unchanged.
        env:
          COORDINODE_TEST_RAFT_GENEROUS_TIMEOUTS: "1"
        run: cargo nextest run --all-features --workspace
      - name: Run doc tests
        run: cargo test --doc --all-features
      - name: Clean the build output
        # The self-hosted runner is shared by several repositories and keeps
        # whatever a job leaves behind, so the build tree goes at the end of
        # every run, a failed one included. The job's result is unaffected.
        if: always()
        run: cargo clean

  build:
    name: Build
    # See `test` job: the release build is even larger than debug and
    # won't fit on GH-hosted runner disk.
    runs-on:
      - self-hosted
      - coordinode
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler (skip if present)
        # `protoc` is preinstalled on the self-hosted runner (Fedora,
        # uses dnf — apt-get would not exist there and `sudo apt-get`
        # would prompt for a password the workflow can't supply).
        # GH-hosted ubuntu-latest still needs the install.
        run: |
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already installed: $(protoc --version)"
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --all-features
      - name: Clean the build output
        # Same as the `test` job: the shared self-hosted runner keeps nothing.
        if: always()
        run: cargo clean

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
