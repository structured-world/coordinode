name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run also runs the multi-node cluster schemes (`test-cluster`),
  # which a push or a pull request leaves out.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protobuf compiler (skip if present)
        # `protoc` is preinstalled on the self-hosted runner (Fedora,
        # uses dnf — apt-get would not exist there and `sudo apt-get`
        # would prompt for a password the workflow can't supply).
        # GH-hosted ubuntu-latest still needs the install.
        run: |
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already installed: $(protoc --version)"
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  rustdoc:
    name: API docs
    # Broken intra-doc links, links to private items and stray HTML tags only
    # surface in rustdoc, which no other job runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler (skip if present)
        run: |
          if command -v protoc >/dev/null 2>&1; then
            echo "protoc already installed: $(protoc --version)"
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Build API docs (zero warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features

  test:
    name: Test
    # GH-hosted ubuntu-latest has ~14 GB disk which the full workspace
    # debug build exceeds (linker hits "No space left on device"). Moved
    # to a self-hosted runner where target/ has room.
    # A self-hosted runner sits inside the internal network, so a pull request
    # from a fork never reaches it: a maintainer moves the branch into this
    # repository or dispatches the workflow on the commit instead.
    if: github.repository_owner == 'structured-world' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - coordinode
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use the runner's rustup
        # The self-hosted runner is shared with other projects and keeps
        # rustup in $CARGO_HOME, which is not on the job's PATH. Without this
        # the toolchain action installs rustup again over the copy other jobs
        # are running, which removes its proxies (cargo, rustc) for a moment.
        run: |
          if [ -x "${CARGO_HOME:-$HOME/.cargo}/bin/rustup" ]; then
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Check protobuf compiler and well-known types
        # The self-hosted runner gets its packages from
        # scripts/linux/provision.sh; the job cannot install them (dnf, and
        # sudo would ask for a password). The protos import
        # google/protobuf/*.proto, which ship with the headers package, not
        # with protoc itself.
        run: |
          if ! command -v protoc >/dev/null 2>&1 \
            || { [ ! -f /usr/include/google/protobuf/empty.proto ] \
              && [ ! -f /usr/local/include/google/protobuf/empty.proto ]; }; then
            echo "::error::protoc or the protobuf well-known types are missing on this runner; run scripts/linux/provision.sh against it"
            exit 1
          fi
          echo "protoc: $(protoc --version)"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build coordinode binary (required by integration tests)
        run: cargo build -p coordinode-server --all-features
      - name: Run unit + integration tests (nextest)
        # The self-hosted runner is shared (CI, bench, and HNSW workflows can
        # run concurrently), so CPU oversubscription can starve Raft heartbeats
        # and trigger spurious elections in the election-timing-sensitive cluster
        # tests. Give those tests generous election timeouts; production timeouts
        # (300-600ms) are unchanged.
        env:
          COORDINODE_TEST_RAFT_GENEROUS_TIMEOUTS: "1"
        run: cargo nextest run --all-features --workspace
      - name: Run doc tests
        run: cargo test --doc --all-features
      - name: Clean the build output
        # The self-hosted runner is shared by several repositories and keeps
        # whatever a job leaves behind, so the build tree goes at the end of
        # every run, a failed one included. The job's result is unaffected.
        if: always()
        run: cargo clean

  test-cluster:
    name: Test (cluster schemes)
    # The multi-node cluster tests bring up real Raft groups and run one at a
    # time, which holds a run for minutes; they run only when asked for.
    # Fork pull requests never reach a self-hosted runner (see `test`).
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'structured-world' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - coordinode
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use the runner's rustup
        # See the `test` job: the shared runner's rustup must not be installed
        # again.
        run: |
          if [ -x "${CARGO_HOME:-$HOME/.cargo}/bin/rustup" ]; then
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Check protobuf compiler and well-known types
        # See the `test` job: the runner is provisioned, not the job.
        run: |
          if ! command -v protoc >/dev/null 2>&1 \
            || { [ ! -f /usr/include/google/protobuf/empty.proto ] \
              && [ ! -f /usr/local/include/google/protobuf/empty.proto ]; }; then
            echo "::error::protoc or the protobuf well-known types are missing on this runner; run scripts/linux/provision.sh against it"
            exit 1
          fi
          echo "protoc: $(protoc --version)"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build coordinode binary (required by integration tests)
        run: cargo build -p coordinode-server --all-features
      - name: Run the cluster schemes (nextest)
        # Shared runner: generous election timeouts, as in the `test` job.
        env:
          COORDINODE_TEST_RAFT_GENEROUS_TIMEOUTS: "1"
        run: cargo nextest run -P cluster --all-features --workspace
      - name: Run the power-cut sweeps (nextest)
        # Minutes each, so outside the default profile as well.
        run: cargo nextest run -P slow --all-features --workspace
      - name: Clean the build output
        if: always()
        run: cargo clean

  test-windows:
    name: Test (Windows)
    # File locking, path handling and socket teardown differ on Windows, and a
    # divergence there shows up only when the suite runs on it. The runner's
    # label is its own, so the Linux-only jobs above never land on it.
    # Fork pull requests never reach a self-hosted runner (see `test`).
    if: github.repository_owner == 'structured-world' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - coordinode-windows
    env:
      # A product embedding the library links the C runtime statically; build
      # and test the same way.
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
      PROTOC_VERSION: "36.2"
      PROTOC_SHA256: f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3
      NEXTEST_VERSION: "0.9.146"
    defaults:
      run:
        # The machine has Windows PowerShell only (no pwsh), and its policy
        # refuses the unsigned script file every step is written to; the
        # policy is lifted for this process alone. A failing native command
        # fails the step through its exit code. The runner fills in {0} by
        # string formatting, so the line holds no other braces.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; & '{0}'; exit $LASTEXITCODE"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc and cargo-nextest
        # The runner's service account carries a Rust toolchain and nothing
        # else, so the job brings its own tools, pinned, into a directory of
        # its own that later runs reuse.
        run: |
          $tools = Join-Path $env:USERPROFILE '.cache\coordinode-tools'
          $protocDir = Join-Path $tools "protoc-$env:PROTOC_VERSION"
          if (-not (Test-Path (Join-Path $protocDir 'bin\protoc.exe'))) {
            $zip = Join-Path $env:RUNNER_TEMP "protoc-$env:PROTOC_VERSION-win64.zip"
            Invoke-WebRequest -UseBasicParsing -OutFile $zip `
              "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            if ($hash -ne $env:PROTOC_SHA256) { throw "protoc archive sha256 $hash, expected $env:PROTOC_SHA256" }
            Expand-Archive -Force -Path $zip -DestinationPath $protocDir
            Remove-Item $zip
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $protocDir 'bin')
          $nextestDir = Join-Path $tools "cargo-nextest-$env:NEXTEST_VERSION"
          if (-not (Test-Path (Join-Path $nextestDir 'bin\cargo-nextest.exe'))) {
            cargo install -q --locked --root $nextestDir "cargo-nextest@$env:NEXTEST_VERSION"
            if ($LASTEXITCODE) { throw "installing cargo-nextest $env:NEXTEST_VERSION failed" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $nextestDir 'bin')
      - uses: Swatinem/rust-cache@v2
      - name: Build coordinode binary (required by integration tests)
        run: cargo build -p coordinode-server --all-features
      - name: Run unit + integration tests (nextest)
        # Same reason as the `test` job: the machine is shared with other
        # runners, so the election-timing-sensitive cluster tests get
        # generous election timeouts.
        env:
          COORDINODE_TEST_RAFT_GENEROUS_TIMEOUTS: "1"
        run: cargo nextest run --all-features --workspace
      - name: Run doc tests
        run: cargo test --doc --all-features
      - name: Clean the build output
        # The machine is shared with other runners and people; nothing stays.
        if: always()
        run: cargo clean

  test-macos:
    name: Test (macOS ${{ matrix.target }})
    # The crates a product embedding the database or talking to it links, on
    # both Mac architectures: the engine, replication, the session core and
    # the driver. The runner is Arm; the Intel build runs its tests under
    # Rosetta. The server and its integration tests are left to the Linux and
    # Windows jobs, which have the disk for them; macOS is not a server target.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CRATES: -p coordinode-embed -p coordinode-storage -p coordinode-raft -p coordinode-query -p coordinode-replicate -p coordinode-session -p coordinode-client
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Install protobuf, and Rosetta for the Intel build
        run: |
          brew install protobuf
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run the library tests (nextest)
        # Shared GitHub runners: the same generous election timeouts as the
        # other test jobs.
        env:
          COORDINODE_TEST_RAFT_GENEROUS_TIMEOUTS: "1"
        run: cargo nextest run --all-features --target ${{ matrix.target }} $CRATES
      - name: Run doc tests
        run: cargo test --doc --all-features --target ${{ matrix.target }} $CRATES

  build:
    name: Build
    # See `test` job: the release build is even larger than debug and
    # won't fit on GH-hosted runner disk.
    # Fork pull requests never reach a self-hosted runner (see `test`).
    if: github.repository_owner == 'structured-world' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      - self-hosted
      - coordinode
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use the runner's rustup
        # See the `test` job: the shared runner's rustup must not be installed
        # again.
        run: |
          if [ -x "${CARGO_HOME:-$HOME/.cargo}/bin/rustup" ]; then
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Check protobuf compiler and well-known types
        # See the `test` job: the runner is provisioned, not the job.
        run: |
          if ! command -v protoc >/dev/null 2>&1 \
            || { [ ! -f /usr/include/google/protobuf/empty.proto ] \
              && [ ! -f /usr/local/include/google/protobuf/empty.proto ]; }; then
            echo "::error::protoc or the protobuf well-known types are missing on this runner; run scripts/linux/provision.sh against it"
            exit 1
          fi
          echo "protoc: $(protoc --version)"
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --all-features
      - name: Clean the build output
        # Same as the `test` job: the shared self-hosted runner keeps nothing.
        if: always()
        run: cargo clean

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
