name: Prepare and qualify embedded registry packages
description: Build archives and run a separate disk-backed consumer on stable Rust
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt,clippy
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-hakari@0.9.39,cargo-local-registry@0.2.12
    - name: Install the source-only protobuf compiler and mold
      # mold: the project's cargo config links with it on Linux.
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev mold
    - uses: actions/setup-node@v7
      with:
        node-version: current
    - name: Prepare archives and qualify their external consumer
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
        CARGO_PROFILE_DEV_DEBUG: "0"
      run: |
        set -euo pipefail
        npm ci --prefix scripts/release
        (cd scripts/release && node --test)
        node scripts/release/prepare.ts --checkout "$GITHUB_WORKSPACE"
        node scripts/release/check_packages.ts --checkout "$GITHUB_WORKSPACE" \
          --consumer-toolchain stable
