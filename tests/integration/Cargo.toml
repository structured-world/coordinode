[package]
name = "coordinode-integration"
description = "Integration test suite for CoordiNode — spawns the server binary and exercises gRPC APIs end-to-end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Integration tests run via `cargo nextest run -p coordinode-integration`.
# Each test file under tests/ is a separate test binary.

[[test]]
name = "restart"
path = "tests/restart.rs"

[[test]]
name = "vector"
path = "tests/vector.rs"

[[test]]
name = "cluster"
path = "tests/cluster.rs"

[[test]]
name = "cypher"
path = "tests/cypher.rs"

[dependencies]
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
coordinode-client = { path = "../../crates/coordinode-client" }
coordinode-test-fixtures = { path = "../../crates/coordinode-test-fixtures" }
coordinode-workspace-hack = { version = "0.1", path = "../../crates/coordinode-workspace-hack" }

# Asks a spawned server to stop with a console control event, the Windows
# counterpart of SIGTERM.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-prost-build = "0.14"

# The workspace lints, except that unsafe code is denied rather than
# forbidden: sending a console control event to a child on Windows is one FFI
# call, allowed at that call site alone (`harness::request_shutdown`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
disallowed_types = "allow"
