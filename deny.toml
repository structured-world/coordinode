# cargo-deny configuration for CoordiNode.
# Run: cargo deny check licenses

[licenses]
# Allow these licenses (CE is AGPL-3.0, dependencies must be compatible)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "AGPL-3.0-only",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[advisories]
ignore = [
    # chrono is unmaintained, with no fixed release. It comes in only through
    # pg_interval, which pgwire's server API requires and which depends on
    # chrono for a chrono::Duration conversion that pgwire does not use.
    # Drop this once pg_interval puts chrono behind a feature and pgwire
    # takes it without that feature.
    "RUSTSEC-2026-0543",
    # rsa "Marvin Attack" (timing sidechannel on RSA private-key operations).
    # The maintained TLS provider only verifies RSA peer/certificate signatures
    # with public keys. Its key loader and the wire identity admission refuse
    # RSA private keys, including PKCS#8, before activation or rotation.
    # No fixed rsa release exists (patched: []); upgrading to 0.10 alone does
    # not fix Marvin. The REST transcoder has no built-in JWT dependency.
    # Revisit once RustCrypto ships a constant-time `rsa` stable.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
