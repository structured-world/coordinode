# cargo-deny configuration for CoordiNode.
# Run: cargo deny check licenses

[licenses]
# Allow these licenses (CE is AGPL-3.0, dependencies must be compatible)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "AGPL-3.0-only",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[advisories]
ignore = [
    # chrono, chrono-tz and chrono-tz-build are unmaintained, with no fixed
    # release. The workspace itself uses jiff; these come in only through
    # openraft (display-more formats timestamps with chrono-tz) and pgwire
    # (postgres-types interval and timestamp conversions). Revisit when
    # openraft and pgwire drop chrono.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    "RUSTSEC-2026-0559",
    # rsa "Marvin Attack" (timing sidechannel on RSA private-key operations).
    # The maintained TLS provider only verifies RSA peer/certificate signatures
    # with public keys. Its key loader and the wire identity admission refuse
    # RSA private keys, including PKCS#8, before activation or rotation.
    # No fixed rsa release exists (patched: []); upgrading to 0.10 alone does
    # not fix Marvin. The REST transcoder has no built-in JWT dependency.
    # Revisit once RustCrypto ships a constant-time `rsa` stable.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# openraft comes from its upstream main branch until an openraft release
# carries the fixes the workspace needs.
allow-git = ["https://github.com/databendlabs/openraft"]
