# The Cypher parser is generated from cypher.pest (CI checks that the two
# agree); its repetitive match arms are the generator's output, not code to
# review or deduplicate by hand.
#
# The benchmark harness (competitor runners, dataset converters, adapter
# images) is run by an operator on their own machine with their own
# arguments, and none of it ships in the product.
sonar.exclusions=crates/coordinode-query/src/cypher/parser/generated.rs,benches/**,scripts/ann-benchmarks-to-json.py
sonar.cpd.exclusions=crates/coordinode-query/src/cypher/parser/generated.rs

# Actions are referenced by their release tag in every workflow, so a run
# takes the current release of each; a commit-hash reference would freeze it.
sonar.issue.ignore.multicriteria=a1
sonar.issue.ignore.multicriteria.a1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.a1.resourceKey=**/*
