# The Cypher parser is generated from cypher.pest (CI checks that the two
# agree); its repetitive match arms are the generator's output, not code to
# review or deduplicate by hand.
#
# The benchmark harness (competitor runners, dataset converters, adapter
# images) is run by an operator on their own machine with their own
# arguments, and none of it ships in the product.
#
# vendor/ holds openraft's upstream sources, kept as upstream wrote them
# until a release carries what this tree needs; they are reviewed upstream.
sonar.exclusions=crates/coordinode-query/src/cypher/parser/generated.rs,benches/**,scripts/ann-benchmarks-to-json.py,vendor/**
sonar.cpd.exclusions=crates/coordinode-query/src/cypher/parser/generated.rs,vendor/**

# Actions are referenced by their release tag in every workflow, so a run
# takes the current release of each; a commit-hash reference would freeze it.
sonar.issue.ignore.multicriteria=a1,r1,r2,r3
sonar.issue.ignore.multicriteria.a1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.a1.resourceKey=**/*

# The release scripts run in the release workflow (or by a maintainer in a
# disposable checkout of their own) on paths, arguments and a PATH that same
# workflow writes. Nobody less trusted than the invoker supplies any of them,
# so command-line taint into file paths, process arguments and PATH lookup
# crosses no boundary.
sonar.issue.ignore.multicriteria.r1.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.r1.resourceKey=scripts/release/**
sonar.issue.ignore.multicriteria.r2.ruleKey=tssecurity:S8705
sonar.issue.ignore.multicriteria.r2.resourceKey=scripts/release/**
sonar.issue.ignore.multicriteria.r3.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.r3.resourceKey=scripts/release/**
