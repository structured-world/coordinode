# CoordiNode: a throwaway server for manual testing, on offset ports so it runs
# beside a development one, with its data on tmpfs (gone when it stops).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down

services:
  coordinode-test:
    build: .
    image: coordinode:test
    container_name: coordinode-test
    ports:
      - "17080:7080"   # gRPC (test port offset)
      - "17084:7084"   # Ops
    tmpfs:
      - /data:size=256M
    environment:
      - COORDINODE_LOG_FORMAT=json
    healthcheck:
      test: ["CMD", "/coordinode", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
