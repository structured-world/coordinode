[workspace]
# No crates.io publishing — coordinode is a server binary, not a library.
# Releases produce musl binaries + Docker image pushed to ghcr.io.
#
# Nothing here versions independently: all twenty-one crates inherit
# `version.workspace = true` and ship as one binary, so `v{{ version }}` is the
# only tag that means anything. Every crate measures itself against that one
# tag and sits in one `version_group`, so a change anywhere raises the single
# workspace version, and a fix living in `coordinode-storage` or
# `coordinode-raft` reaches a release of the binary without touching its
# directory.
semver_check = false
git_only = true
publish = false
git_tag_enable = false
git_release_enable = false
git_tag_name = "v{{ version }}"

# Only the commit types that reach the changelog can start a release, mirroring
# the `commit_parsers` skip-list below. A `chore` or `ci` commit that happens to
# touch a crate directory would otherwise read as unreleased work and open a
# release PR with an empty changelog. A release still happens the moment any
# real change lands.
release_commits = "^(feat|fix|perf|refactor|docs|test)"

# Every crate shares one version and the server's changelog already folds in
# the commits of all of them, so the release PR leads with that one changelog.
# Under it, each library crate that received commits gets its own collapsed
# section, so a reader can see which crate an entry came from. Attribution is
# by the files a commit touched, so a dependency bump can land an entry in a
# crate its subject never mentions.
#
# The stock body lists every crate unconditionally, and for a crate that only
# got the version bump it prints the previous entry of its changelog as if it
# were new. The `## v<next_version>` test is what separates the two: a crate
# with no commits carries an older heading, so it is left out.
pr_body = """
## New release
{% for release in releases %}{% if release.package == "coordinode-server" %}
`coordinode` {{ release.previous_version }} -> {{ release.next_version }} (all {{ releases | length }} workspace crates share this version)

{% if release.changelog %}{{ release.changelog }}{% endif %}
{% endif %}{% endfor %}
### Where the changes landed

The list above is the folded view. Each crate below carries the entries written
to its own changelog; a crate with no commits since the last release is absent.
{% for release in releases %}{% if release.package != "coordinode-server" %}{% if release.changelog %}{% set marker = "## v" ~ release.next_version %}{% if marker in release.changelog %}
<details><summary><code>{{ release.package }}</code></summary>
{% set lines = release.changelog | trim | split(pat="\n") %}{% for line in lines %}{% if not loop.first %}{{ line }}
{% endif %}{% endfor %}
</details>
{% endif %}{% endif %}{% endif %}{% endfor %}
---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).
"""

[changelog]
# The upstream default body with one change: the version header is
# `## v<version> - <date>`, the shape the release workflow extracts the GitHub
# release notes by. The blank first line is part of the layout: it separates
# the entry from what precedes it in the file.
body = """

## v{{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor %}"""
commit_parsers = [
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
    { message = "^docs\\(ci\\)", skip = true },
    { message = "^docs\\(copilot\\)", skip = true },
    { message = "^Merge", skip = true },
    { message = "^Revert", skip = true },
    { message = "^docs", group = "Documentation" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactored" },
    { message = "^test", group = "Testing" },
]

# The shipped binary — only this crate gets a git tag and GitHub Release. Its
# changelog is the repository's: the root CHANGELOG.md, with the commits of
# every other crate folded in, each listed once however many crates it touched.
[[package]]
name = "coordinode-server"
version_group = "coordinode"
git_tag_enable = true
git_release_enable = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "coordinode-client",
    "coordinode-integration",
    "coordinode-auth",
    "coordinode-bench",
    "coordinode-cluster",
    "coordinode-core",
    "coordinode-embed",
    "coordinode-modality",
    "coordinode-query",
    "coordinode-raft",
    "coordinode-replicate",
    "coordinode-s3",
    "coordinode-search",
    "coordinode-session",
    "coordinode-storage",
    "coordinode-test-fixtures",
    "coordinode-timeseries",
    "coordinode-vector",
    "coordinode-swarm",
    "coordinode-wire",
]

# ─── Library crates ────────────────────────────────────────────────────
#
# They inherit `git_tag_enable = false` and the workspace `git_tag_name`, so
# they create no tags of their own and measure against `v{{ version }}`. Each
# keeps its own crates/<name>/CHANGELOG.md, written by release-plz from the
# commits that touched that crate.
#
# A crate added after the last tag does not exist at the commit the tag points
# to. If release-plz fails to find it there, give that one crate a temporary
# `git_tag_name` of its own until the next release covers it.
#
# A new crate must be added both here and to `changelog_include` above.

[[package]]
name = "coordinode-client"
version_group = "coordinode"

[[package]]
name = "coordinode-integration"
version_group = "coordinode"
# Lives under tests/, outside crates/: its commits reach the root changelog
# through `changelog_include`, and it keeps no file of its own.
changelog_update = false

[[package]]
name = "coordinode-auth"
version_group = "coordinode"

[[package]]
name = "coordinode-bench"
version_group = "coordinode"

