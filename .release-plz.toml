[workspace]
# No crates.io publishing — coordinode is a server binary, not a library.
# Releases produce musl binaries + Docker image pushed to ghcr.io.
#
# Because every crate has `publish = false`, our forked release-plz
# auto-disables cascade version bumps for them (see release-plz/release-plz#2799),
# so only crates carrying direct conventional commits since the last tag get a
# new version. On its own that silently strands every fix: what ships is the
# `coordinode-server` binary, it owns the tag and the GitHub release, and a fix
# living in `coordinode-storage` or `coordinode-raft` leaves its directory
# untouched. v0.5.1 went out that way, without the two crash fixes that were
# already sitting on main.
#
# Nothing here versions independently: all twenty crates inherit
# `version.workspace = true` and ship as one binary, so `v{{ version }}` is the
# only tag that means anything. Measuring every crate against that one tag is
# what makes a library fix reach a release, plus `dependent_update` below so the
# binary is not skipped for being `publish = false`.
semver_check = false
git_only = true
publish = false
# Per-crate CHANGELOG.md is enabled: each crate under crates/ gets its own
# CHANGELOG.md updated by release-plz. A workspace-wide CHANGELOG.md is
# additionally generated by git-cliff in the release workflow.
git_tag_enable = false
git_release_enable = false
git_tag_name = "v{{ version }}"
# All crate changes are aggregated into a single CHANGELOG.md at the repo root.
# Each crate gets its own subsection grouped under the version header.
workspace_changelog = "CHANGELOG.md"

[changelog]
commit_parsers = [
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
    { message = "^docs\\(ci\\)", skip = true },
    { message = "^docs\\(copilot\\)", skip = true },
    { message = "^Merge", skip = true },
    { message = "^Revert", skip = true },
    { message = "^docs", group = "Documentation" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactored" },
    { message = "^test", group = "Testing" },
]

# The shipped binary — only this crate gets a git tag and GitHub Release.
# CHANGELOG.md is generated here (per-crate) AND aggregated workspace-wide.
[[package]]
name = "coordinode-server"
# Without this the binary is skipped as an unpublishable crate with no direct
# commits, and a fix in any library never reaches a release.
dependent_update = true
git_tag_enable = true
git_release_enable = true

# ─── Library crates ────────────────────────────────────────────────────
#
# Listed only so their commits reach the aggregated workspace CHANGELOG.md.
# They inherit `git_tag_enable = false` and the workspace `git_tag_name`, so
# they create no tags of their own and measure against `v{{ version }}`.
#
# They used to carry a unique `git_tag_name` each, to stop release-plz adopting
# the workspace tag as their baseline and then failing to find a crate that did
# not yet exist at that commit. The cure was worse: the patterns named tags that
# are never created, so every crate looked like an unreleased initial release,
# never raised the version, and a fix living outside crates/coordinode-server/
# could not produce a release at all.
#
# The old hazard returns only for a crate added after the last tag. Give that
# one crate a temporary `git_tag_name` of its own until the next release covers
# it, the way coordinode-session needed.
#
# We do NOT set `release = false` — that flag drops the crate from the
# workspace CHANGELOG.md aggregation our fork does (release-plz#2791).

[[package]]
name = "coordinode-client"

[[package]]
name = "coordinode-integration"

[[package]]
name = "coordinode-auth"

[[package]]
name = "coordinode-bench"

[[package]]
name = "coordinode-cluster"

[[package]]
name = "coordinode-core"

[[package]]
name = "coordinode-embed"

[[package]]
name = "coordinode-modality"

[[package]]
name = "coordinode-query"

[[package]]
name = "coordinode-raft"

[[package]]
name = "coordinode-replicate"

[[package]]
name = "coordinode-s3"

[[package]]
name = "coordinode-search"

[[package]]
name = "coordinode-session"

[[package]]
name = "coordinode-storage"

[[package]]
name = "coordinode-test-fixtures"

[[package]]
name = "coordinode-timeseries"

[[package]]
name = "coordinode-vector"

[[package]]
name = "coordinode-swarm"

[[package]]
name = "coordinode-wire"

# Bench crates (coordinode-gold-bench, coordinode-bench-vector-ann) live in
# their own standalone workspaces under benches/. They are intentionally
# excluded from release-plz tracking since they never ship and are versioned
# independently of the server release line.
