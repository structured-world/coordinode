# Nextest configuration for coordinode
# See https://nexte.st/docs/configuration/

[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
# Multi-node cluster schemes run only when asked for (`-P cluster`). Each
# brings up real Raft groups with gRPC and election timeouts, and one at a
# time they hold the run for minutes; the default run stays fast. The set is
# the same binaries as the raft-cluster group below.
#
# The power-cut sweeps run only when asked for too (`-P slow`): each one cuts
# power at every write or sync of a workload and recovers, and takes minutes
# on its own and ten under a loaded host.
default-filter = "not (binary(raft_cluster) + binary(cluster) + binary(follower_reads) + binary(shutdown_without_quorum) + binary(derived_index) + binary(jepsen) + binary(standalone_growth) + binary(tls_cluster) + binary(cluster_vector_replication) + binary(restore_in_a_group) + binary(write_forwarding) + binary(version_moves) + binary(out_of_space) + test(/a_power_cut_/))"
# A leak is a child process still holding the test's stdout/stderr after the
# test exits. Under a loaded run nextest itself can see the pipe close more
# than the default 100ms after exit, which flags pure tests that spawn
# nothing; a real leaked child (a server left running) outlives one second.
leak-timeout = "1s"

[profile.default.slow-timeout]
period = "30s"

# Raft cluster tests: one at a time.
# Each test spawns 3 tokio runtimes with gRPC servers, election-timing-
# sensitive (300-600ms), and every member fsyncs its log. Each test claims 3
# threads (one per node) and the group caps at 3, so one cluster runs at a
# time. Two at once beside the rest of the package still pushed members past
# their 30 s bounds on a macOS host, where a durable fsync is expensive; one
# at a time ran the whole raft package green (249/249).
#
# Every binary that spawns multi-node clusters joins the same group: they
# share the election timing, so one left outside oversubscribes the CPU
# alongside the tests that are inside, and the failures land on whichever
# test was waiting on an election at the time.
#
# On macOS a cluster test runs alone. Every durable sync there is a full
# device flush (F_FULLFSYNC), and a member's shutdown checkpoint flushes and
# checkpoints each partition; beside the storage and embed tests, which flush
# just as hard, that step grew from 0.5 s to 5 s per member and the tests ran
# past their 30 s bounds, while the same tests alone pass every time. Linux
# and Windows sync per file without a device flush and keep the shared
# schedule. First matching override wins, so this one precedes the general one.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = "binary(raft_cluster) + binary(cluster) + binary(follower_reads) + binary(shutdown_without_quorum) + binary(derived_index) + binary(jepsen) + binary(standalone_growth) + binary(tls_cluster) + binary(cluster_vector_replication) + binary(restore_in_a_group) + binary(write_forwarding) + binary(version_moves) + binary(out_of_space)"
threads-required = "num-test-threads"
test-group = "raft-cluster"

[[profile.default.overrides]]
filter = "binary(raft_cluster) + binary(cluster) + binary(follower_reads) + binary(shutdown_without_quorum) + binary(derived_index) + binary(jepsen) + binary(standalone_growth) + binary(tls_cluster) + binary(cluster_vector_replication) + binary(restore_in_a_group) + binary(write_forwarding) + binary(version_moves) + binary(out_of_space)"
threads-required = 3
test-group = "raft-cluster"

[test-groups.raft-cluster]
max-threads = 3

# Heavy property-based tests: bounded concurrency to prevent oversubscription
# when they coincide with raft tests. Each proptest claims 2 threads; group
# caps at 4 → at most 2 proptests concurrent, leaving headroom for raft and
# the rest of the workspace. Cases-per-test was reduced (modality 128→32,
# storage 64→32) — see test source comments.
[[profile.default.overrides]]
filter = "test(/proptest_invariants/) + test(/coordinator_proptest/)"
threads-required = 2
test-group = "heavy-proptest"

[test-groups.heavy-proptest]
max-threads = 4

# The multi-node cluster schemes, run explicitly:
# `cargo nextest run -P cluster --workspace --all-features`.
[profile.cluster]
fail-fast = false
leak-timeout = "1s"
default-filter = "binary(raft_cluster) + binary(cluster) + binary(follower_reads) + binary(shutdown_without_quorum) + binary(derived_index) + binary(jepsen) + binary(standalone_growth) + binary(tls_cluster) + binary(cluster_vector_replication) + binary(restore_in_a_group) + binary(write_forwarding) + binary(version_moves) + binary(out_of_space)"

[profile.cluster.slow-timeout]
period = "30s"

# The power-cut sweeps, run explicitly:
# `cargo nextest run -P slow --workspace --all-features`.
[profile.slow]
fail-fast = false
leak-timeout = "1s"
default-filter = "test(/a_power_cut_/)"

[profile.slow.slow-timeout]
period = "120s"

# CI profile: inherits overrides via re-declaration + JUnit output
[profile.ci]
fail-fast = false
leak-timeout = "1s"

[profile.ci.slow-timeout]
period = "60s"

[profile.ci.junit]
path = "junit.xml"

[[profile.ci.overrides]]
filter = "binary(raft_cluster) + binary(cluster) + binary(follower_reads) + binary(shutdown_without_quorum) + binary(derived_index) + binary(jepsen) + binary(standalone_growth) + binary(tls_cluster) + binary(cluster_vector_replication) + binary(restore_in_a_group) + binary(write_forwarding) + binary(version_moves) + binary(out_of_space)"
threads-required = 3
test-group = "raft-cluster"

[[profile.ci.overrides]]
filter = "test(/proptest_invariants/) + test(/coordinator_proptest/)"
threads-required = 2
test-group = "heavy-proptest"
