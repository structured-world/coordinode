[package]
name = "coordinode-cluster"
description = "Layer 6 cluster topology: ClusterTopology + ShardRouting traits with CE SingleNodeTopology + SingleShardRouting implementations over a 5-level failure-domain hierarchy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/coordinode-cluster"

[dependencies]
coordinode-storage = { workspace = true }
serde = { workspace = true }
# The chunk table's stored form.
rmp-serde = { workspace = true }
smallvec = "1.16"
thiserror = { workspace = true }
tracing = { workspace = true }
# CE LocalStateMachine: background transition tasks + broadcast event streams.
tokio = { workspace = true, optional = true }
parking_lot = { workspace = true }
coordinode-workspace-hack = { version = "0.1", path = "../coordinode-workspace-hack" }

[features]
# The in-process state-machine backend, which runs its transitions on tokio
# tasks. Off by default: the routing and topology types alone need no async
# runtime.
local-state-machine = ["dep:tokio"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[[bench]]
name = "topology_throughput"
harness = false

[lints]
workspace = true
