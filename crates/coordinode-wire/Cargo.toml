[package]
name = "coordinode-wire"
description = "Inter-node wire transport codec: pure-Rust zstd compression for gRPC messages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/coordinode-wire"

[dependencies]
tonic = { workspace = true, features = ["tls-webpki-roots"] }
prost = { workspace = true }
bytes = { workspace = true }
# Pure-Rust zstd (no C FFI) for transport compression. 0.2 is the floor: its
# streaming decoder is built infallibly, as the code here calls it.
structured-zstd = "0.2"
# Shared pure-Rust TLS provider.
rustls = { version = "0.23", default-features = false }
sid-crypto = { version = "0.1", default-features = false, features = ["std", "tls-rustcrypto", "tls12"] }
# Local identity admission retains product policy outside the shared TLS adapter.
der = { version = "0.8", default-features = false }
pkcs8 = { version = "0.11", default-features = false }
sec1 = { version = "0.8", default-features = false }
# Fallible process-wide provider initialization must not cache an initialization error.
once_cell = "1"
# PEM parsing lives in rustls-pki-types now (rustls-pemfile is unmaintained).
rustls-pki-types = { version = "1", features = ["std"] }
# Chain validation for peer identities, the verifier rustls itself uses.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# Trust and credentials replaced whole without a restart.
arc-swap = "1.9"
thiserror = { workspace = true }
# Authenticated peer connections: TLS over tokio, on the selected provider;
# the default aws-lc-rs provider would link C.
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false }
# A dialed TLS connection handed to tonic's HTTP/2 client.
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
futures-util = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
coordinode-workspace-hack = { version = "0.1", path = "../coordinode-workspace-hack" }

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
