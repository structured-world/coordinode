[package]
name = "coordinode-embed"
description = "Embedded library API: open database, execute Cypher, vector search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/coordinode-embed"

[features]
# Use the io_uring storage backend on Linux (forwards to
# coordinode-storage/io-uring). On through coordinode-storage's defaults;
# no-op on non-Linux targets.
io-uring = ["coordinode-storage/io-uring"]
# A database that is a member of a replicated group: consensus, the
# inter-node channel and its listener. Without it none of them is compiled
# and the library needs no async runtime.
replication = [
    "dep:coordinode-raft",
    "dep:coordinode-wire",
    "coordinode-replicate/transfer",
    "dep:coordinode-session",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic",
    "dep:prost",
]
# Test builds only: steps a test runs inside the index workers. Never
# enabled in a release build.
test-hooks = []
# Bench builds only: the vector top-k bench counts each statement's
# allocations instead of timing it under the system allocator.
bench-alloc = []

[dependencies]
coordinode-core = { workspace = true }
coordinode-query = { workspace = true }
coordinode-raft = { workspace = true, optional = true }
# The inter-node channel: node identity, the listener, segment transfer.
coordinode-wire = { workspace = true, optional = true }
# The consumer registry always; segment transfer with `replication`.
coordinode-replicate = { workspace = true }
# The slots routed commands run in, shared with the member's own clients.
coordinode-session = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# The answer of a routed statement streams to the member that sent it.
tokio-stream = { version = "0.1", optional = true }
tonic = { workspace = true, optional = true }
# A routed command's failure is encoded by the library and carried as bytes.
prost = { workspace = true, optional = true }
coordinode-vector = { workspace = true }
coordinode-search = { workspace = true }
coordinode-storage = { workspace = true }
coordinode-modality = { workspace = true }
# Needed for `Database::open_in_memory()` which constructs a MemFs-backed
# engine. Also a useful production capability for ephemeral test
# harnesses + in-process benchmarks against EmbeddedDb directly.
lsm-tree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
# Digest of a restore's input, which identifies an interrupted load on rerun.
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
# Node keys the vector index worker collects: internal keys, no
# attacker-chosen hash input.
rustc-hash = { workspace = true }
# The host draws its transaction IDs as random UUIDs, as any client does.
uuid = { version = "1", features = ["v4"] }
coordinode-workspace-hack = { version = "0.1", path = "../coordinode-workspace-hack" }

[dev-dependencies]
# The crate's own tests pause its index workers.
coordinode-embed = { path = ".", features = ["test-hooks"] }
chrono = { workspace = true }
# Failure injection into the text indexes this crate's tests drive.
coordinode-search = { workspace = true, features = ["test-hooks"] }
# A certification paused after its proof, for the races of its tests.
coordinode-query = { workspace = true, features = ["test-hooks"] }
# A vector test prints the graph when a search misses a node.
coordinode-vector = { workspace = true, features = ["graph-dump"] }
# The oplog placement test opens the consensus log store on an embedded
# directory.
coordinode-raft = { workspace = true }
tempfile = { workspace = true }
coordinode-test-fixtures = { workspace = true }
metrics = { workspace = true }
metrics-util = "0.20"
# Synchronize retry fixtures with the existing diagnostic event.
tracing-subscriber = { workspace = true }
# The routing bench counts allocations per command.
stats_alloc = "0.1"
# The vector bench counts the bytes a statement's own allocations hold at once.
tracking-allocator = { version = "0.4", default-features = false }
# The routing bench's floor: an echo over the members' own mutual TLS.
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
# The footprint tests count a file reached under several names once, on
# Windows too (by volume and file index).
same-file = "1"

# A replicated group through the entry point a host opens.
[[test]]
name = "replicated"
required-features = ["replication"]

[[bench]]
name = "field_names"
harness = false

[[bench]]
name = "index_write"
harness = false

[[bench]]
name = "temporal_unique"
harness = false

[[bench]]
name = "label_kinds"
harness = false

[[bench]]
name = "text_history"
harness = false

[[bench]]
name = "index_rewrites"
harness = false

[[bench]]
name = "snapshot_scan"
harness = false

[[bench]]
name = "label_scan"
harness = false

[[bench]]
name = "vector_queries"
harness = false

[[bench]]
name = "vector_topk"
harness = false

[[bench]]
name = "correlated_probe"
harness = false

[[bench]]
name = "borrowed_point"
harness = false

[[bench]]
name = "repair_budget"
harness = false

[[bench]]
name = "index_check"
harness = false

# Reopening after a process died with its index copies in use.
[[bench]]
name = "index_recovery"
harness = false

[[bench]]
name = "operation_identity"
harness = false

[[bench]]
name = "volatile_writes"
harness = false

# What consumer retention costs writes, transitions, listings and opens.
[[bench]]
name = "consumers"
harness = false

[[bench]]
name = "schema_package"
harness = false

# A command routed to the leader against the same command run there.
[[bench]]
name = "routing"
harness = false
required-features = ["replication"]

[lints]
workspace = true
