[package]
name = "coordinode-query"
description = "Query layer: OpenCypher parser, query planner, GraphQL auto-generation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/coordinode-query"

[features]
cjk-zh = ["coordinode-search/cjk-zh"]
cjk-ja = ["coordinode-search/cjk-ja"]
cjk-ko = ["coordinode-search/cjk-ko"]
cjk = ["coordinode-search/cjk"]

[dependencies]
coordinode-core = { workspace = true }
coordinode-storage = { workspace = true }
coordinode-modality = { workspace = true }
coordinode-vector = { workspace = true }
coordinode-cluster = { workspace = true }
coordinode-search = { workspace = true }
pest = { workspace = true }
sqlparser = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The wait of a full-text search for the indexes to cover the store.
parking_lot = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
regex = "1"
unicode-normalization = "0.1"
# Scratch files an index check spills its sorted runs to.
tempfile = { workspace = true }
# Checksums of an index check's scratch runs, so a damaged run fails the
# check instead of reading as a shorter one.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# What an index check's passes cost, by phase, for the metrics endpoint.
metrics = { workspace = true }
coordinode-workspace-hack = { version = "0.1", path = "../coordinode-workspace-hack" }

[dev-dependencies]
criterion = { workspace = true }
coordinode-embed = { workspace = true }
coordinode-test-fixtures = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "edge_vector_strategy"
harness = false

[[bench]]
name = "vector_merge"
harness = false

[lints]
workspace = true
