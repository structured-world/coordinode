[package]
name = "coordinode-test-fixtures"
description = "Shared test fixtures for the coordinode workspace — `engine_for_logic()` / `engine_for_disk()` / `engine_for_memory()` over `lsm_tree::fs::StdFs` and `MemFs`. Honours `COORDINODE_TEST_BACKEND=memory|disk` env var for CI matrix. Dev-dependency only; never linked into production binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false  # internal test fixture, not for crates.io

[dependencies]
# The power rig cuts the journal and fails its syncs through these hooks.
coordinode-storage = { workspace = true, features = ["test-faults"] }
# The workspace entry, as in coordinode-storage, so both resolve to the same
# lsm-tree instance — different versions would create two `Arc<dyn Fs>` types
# and the `MemFs` we hand to the engine builder would be unusable.
lsm-tree = { workspace = true }
tempfile = { workspace = true }
# Node credentials for tests that open members of a group.
coordinode-wire = { workspace = true }
rcgen = "0.14"
rustls-pki-types = { version = "1", features = ["std"] }
# A test host adapter reads the URI of a chain that already verified.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# Serving a member's port the way the server does, for tests that stand one up.
tokio = { workspace = true }
tonic = { workspace = true }
# A client connecting over TLS with a certificate of its own, on the pure-Rust
# provider the server uses.
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"

[lints.clippy]
# The storage-partition guard (clippy.toml `disallowed-types`) is global and
# warn-by-default; only coordinode-query opts into it. Keep it inert here.
disallowed_types = "allow"
