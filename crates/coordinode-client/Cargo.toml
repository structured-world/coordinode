[package]
name = "coordinode-client"
description = "Official Rust client for CoordiNode — gRPC driver with source location tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Permissive on purpose, unlike the rest of the workspace: a driver is linked
# into the caller's program, and one that only AGPL programs may link has no
# users. The server stays AGPL-3.0-only.
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-test = "0.4"

[lints]
workspace = true
