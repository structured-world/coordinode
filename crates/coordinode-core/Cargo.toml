[package]
name = "coordinode-core"
description = "Core graph engine: property graph model, schema, MVCC transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
streamvbyte64 = "0.2"
smallvec = "1"
# Integrity of the compact application-unit frame.
crc32c = "0.6"
# Identical-slice lookup while encoding a frame: internal byte keys, no DoS hasher needed.
rustc-hash = { workspace = true }
# Async primitives for MaxAssignedWatermark (tokio::sync::watch + timeout).
# Minimal feature set — no runtime dependency dragged in; downstream crates
# that drive the watermark (raft, query) provide their own runtime.
tokio = { workspace = true, features = ["sync", "time"] }

[features]
# Lets COORDINODE_TEST_ENGINE_FORMAT_BUMP raise the engine format version,
# so a test suite runs two versions side by side. Never in a shipped build.
test-format-bump = []

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[[bench]]
name = "document_projection"
harness = false

[[bench]]
name = "node_record_encode"
harness = false

[lints]
workspace = true
