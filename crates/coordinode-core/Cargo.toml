[package]
name = "coordinode-core"
description = "Core graph engine: property graph model, schema, MVCC transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/coordinode-core"

[dependencies]
serde = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
streamvbyte64 = "0.2"
smallvec = "1"
# Wakes the task waiting on a query's cancel switch; no_std.
atomic-waker = "1.1"
# Integrity of the compact application-unit frame.
crc32c = "0.6"
# Identical-slice lookup while encoding a frame: internal byte keys, no DoS hasher needed.
rustc-hash = { workspace = true }
# The watermark waiters park on; the uncontended path stays in user space.
parking_lot = { workspace = true }

[features]
# Lets COORDINODE_TEST_ENGINE_FORMAT_BUMP raise the engine format version,
# so a test suite runs two versions side by side. Never in a shipped build.
test-format-bump = []

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[[bench]]
name = "document_projection"
harness = false

[[bench]]
name = "node_record_encode"
harness = false

[lints]
workspace = true
