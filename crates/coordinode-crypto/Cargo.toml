[package]
name = "coordinode-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Pure-Rust RustCrypto provider for rustls"
repository = "https://github.com/structured-world/structured-proxy"
readme = "README.md"
publish = true

[dependencies]
aead = { version = "0.6", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
crypto-common = { version = "0.2", default-features = false }
crypto-bigint = { version = "0.7.6", default-features = false }
der = { version = "0.8", default-features = false }
digest = { version = "0.11", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["pkcs8", "zeroize"] }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
p256 = { version = "0.14", default-features = false, features = ["alloc", "pkcs8", "ecdsa", "ecdh"] }
p384 = { version = "0.14", default-features = false, features = ["alloc", "pkcs8", "ecdsa", "ecdh"] }
pkcs8 = { version = "0.11", default-features = false }
pki-types = { package = "rustls-pki-types", version = "1", default-features = false }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["sha2", "encoding"] }
rustls = { version = "0.23", default-features = false }
sec1 = { version = "0.8", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
signature = { version = "3", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", default-features = false }

[features]
default = ["std", "tls12"]
std = ["alloc", "pki-types/std", "rustls/std"]
alloc = ["pki-types/alloc", "aead/alloc", "ed25519-dalek/alloc"]
tls12 = ["rustls/tls12"]
logging = ["rustls/logging"]

[dev-dependencies]
# Independent certificate generation is a test oracle, not a runtime dependency.
rcgen = "0.14"
# Independent TLS interoperability oracle, excluded from product dependencies.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
