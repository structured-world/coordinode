# Layer-5 storage-partition guard.
#
# The query layer (coordinode-query) must reach storage only through the
# Layer-4 modality stores (NodeStore, EdgeStore, IndexStore, SchemaStore, ...).
# Naming the physical storage partition enum in the query layer leaks a
# Layer-3 concern upward. The workspace lint table sets
# `clippy::disallowed_types` to allow and coordinode-query alone denies it
# (crate-level `#![deny]`), so the storage / modality crates that
# legitimately name partitions are unaffected. The standalone bench
# workspaces do not inherit that table and repeat the allow themselves.
disallowed-types = [
    { path = "coordinode_storage::engine::partition::Partition", reason = "Layer 5 (coordinode-query) reaches storage only through Layer-4 modality stores; name partitions inside the stores, not the query layer" },
]
